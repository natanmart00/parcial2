<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0 p-4 p-md-5">
        <div class="mb-3">
          <span class="badge bg-danger-subtle text-danger fs-6 px-3 py-2 rounded-pill">
            Error 404 - No Encontrado
          </span>
        </div>
        <h1 class="display-3 fw-bold text-dark mb-2">404</h1>
        <h4 class="fw-semibold text-secondary mb-3">Página no localizada</h4>
        <p class="text-muted mb-4">
          La dirección URL solicitada no existe o ha sido movida dentro del sistema de planilla.
        </p>
        <div>
          <button type="button" class="btn btn-primary px-4 py-2 fw-semibold" (click)="ir_al_inicio()">
            Regresar al Inicio
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
